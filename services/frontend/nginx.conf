server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # index.html référence les bundles hashés (main.<hash>.js) — s'il reste en cache
    # navigateur après un redéploiement, l'utilisateur continue de charger l'ancien build
    # sans le savoir (symptôme vu plusieurs fois : "rien ne se passe", correctif pourtant
    # déployé). On force sa revalidation à chaque chargement.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Les fichiers sous /static/ portent un hash de contenu dans leur nom (CRA) : un
    # changement de code produit toujours un nouveau nom de fichier, donc un cache long est
    # sans risque et accélère les chargements suivants.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
